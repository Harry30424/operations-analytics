[project]
name = "operations-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "kaggle>=2.2.4",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "psycopg2-binary>=2.9.12",
    "pymssql>=2.3.13",
    "pyodbc>=5.3.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
operations-analytics = "operations_analytics:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
